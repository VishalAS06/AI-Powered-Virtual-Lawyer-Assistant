    <div class="fab" id="chat-button">
        <img src="Images/JurisAI_Logo.jpg" alt="Chat Icon">
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chat-box">
        <div class="chat-header">
            <div class="agent-info">
                <img src="Images/JurisAI_Logo.jpg" alt="Agent" class="agent-img">
                <div>
                    <h3>AI-Powered Virtual Lawyer</h3>
                </div>
            </div>
            <div class="icon-container">
                <!--<img src="static/enlarge.png" alt="Chat Icon" style="width: 24px; height: auto;" class="enlarge-icon"> -->
                <span id="close-chat" aria-label="Close chat">&times;</span>
            </div>
        </div>
        <!-- Tab Bar for switching modes -->
        <div class="tab-bar">
            <button class="tab-button active" id="chat-tab">Chat Mode</button>
            <button class="tab-button" id="voice-tab">Voice Mode</button>
        </div>

        <!--Chat Mode-->
        <div class="chat-body" id="chat-body">
            <div class="chat-container">
                <h1 class="greeting">Namaste🙏, How can we assist you today?</h1>
                <div class="quick-replies">
                    <button class="quick-reply-btn">What is FIR?</button>
                    <button class="quick-reply-btn">What is the legal age of consent in India?</button>
                    <button class="quick-reply-btn">What are the basic rights of a tenant in India?</button>
                    <button class="quick-reply-btn">What are the specific regulations regarding land
                        conversion?</button>
                </div>
            </div>
        </div>

        <!--Voice Mode-->
        <div class="voice-body" id="voice-body" style="display: none;">
            <div class="container">
                <div class="top-text" id="transcript"></div>
                <div class="waveform">
                    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
                    <lottie-player src="https://lottie.host/035d6e35-52ff-44d5-9a2b-8636ca6a657f/LVHuP4Bzzr.json"
                        background="#ffffff" speed="1" style="width: 90%; height: 245px; margin-bottom: 10px;"
                        direction="1" mode="normal" loop autoplay></lottie-player>
                </div>
                <div class="mic-section">
                    <div class="mic-icon" id="start-record">
                        <i class="fa fa-microphone" style="font-size: 30px;"></i>
                    </div>
                </div>
            </div>
            <div class="control-buttons" id="controls" style="display: none;">
                <div class="control play" id="play-pause">
                    <i class="fa fa-play"></i>
                </div>
                <div class="control cancel" id="cancel-record">
                    <i class="fa fa-times"></i>
                </div>
            </div>
        </div>

        <div class="chat-footer" id="chat-msg">
            <div class="input-container">
                <input type="text" class="prompt-input" placeholder="Ask me anything" id="chat-input">
                <button class="send-button">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
